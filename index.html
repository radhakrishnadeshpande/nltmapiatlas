const sel=(id,l,o,v)=>`<label class="fl" style="margin:0">${l}<select data-af="${id}"><option value="">All</option>${o.map(x=>`<option${x==v?' selected':''}>${esc(x)}</option>`).join('')}</select></label>`;
const rb=(v,c)=>`<button class="btn rb" style="--c:${c}" data-act="rk-${v}">${v=='Unranked'?'Clear rank':v}</button>`;
a.innerHTML=`<div class="ins"><div class="pn w"><h3>Admin panel</h3><p id="adst" style="margin:0 0 12px;color:var(--mu)"></p>
<div class="row" style="gap:8px"><button class="btn" data-act="add">Add new API</button><button class="btn" data-act="pub" style="background:var(--ac);color:var(--bg)">Publish to GitHub</button>${dr&&!DIRTY?'<button class="btn" data-act="restore">Restore unsaved draft</button>':''}<button class="btn" id="bdisc" data-act="discard" hidden>Discard changes</button><button class="btn" data-act="xa-csv">Export all CSV</button><button class="btn" data-act="xa-xlsx">Export all Excel</button><button class="btn" data-act="xa-json">Export all JSON</button></div><p id="amsg" style="margin:12px 0 0;font-weight:500"></p></div>
<div class="pn"><h3>GitHub connection</h3>${fi('owner','Owner (user or organisation)',c.owner)}${fi('repo','Repository name',c.repo)}${fi('branch','Branch',c.branch)}${fi('path','Data file path',c.path)}${fi('tk','Access token (kept only for this browser session)',sessionStorage.getItem('tk'),'password')}</div>
<div class="pn"><h3>Import a CSV</h3><p style="color:var(--mu);margin-top:0">Use a file with the same column headings as data.csv.</p><input type="file" id="imp" accept=".csv" hidden><div class="row" style="gap:8px"><button class="btn" data-act="imr">Replace everything</button><button class="btn" data-act="ima">Add to existing rows</button></div></div>
<div class="pn w"><h3>All rows and bulk edit</h3><p class="mu sub">Filter the rows, tick the ones you want (or use Select all matching), then change them together. Newest added rows come first.</p>
<div class="row" style="gap:10px;align-items:end;margin-bottom:12px"><label class="fl" style="margin:0;flex:1;min-width:200px">Search<input id="aq" placeholder="Any word" value="${esc(AQ)}"></label>${sel('type','Type',u('Type of API'),AF.type)}${sel('pv','University',pvs,AF.pv)}${sel('rk','Rank',['High','Medium','Low','Unranked'],AF.rk)}${sel('mod','Modality',['Printed','Handwritten','SceneText'],AF.mod)}</div>
<div class="bk"><b id="bkn"></b><span class="mu">Set rank</span>${rb('High','#16a34a')}${rb('Medium','#d97706')}${rb('Low','#dc2626')}${rb('Unranked','#64748b')}<span class="sp"></span>
<select id="bf" aria-label="Field to change">${[['Rank','Rank'],['Level','Level'],['Type of API','Type of API'],['IITD','University'],['Modality','Modality'],['Technical Details associated','Technical details'],['References','References'],['Detailed Remaks','Remarks']].map(([k,l])=>`<option value="${k}"${k==BF?' selected':''}>${l}</option>`).join('')}</select><input id="bv" list="dl-bv" placeholder="New value" class="bvi"><datalist id="dl-bv"></datalist><button class="btn" data-act="bapply">Apply to selected</button>
<button class="btn" data-act="bsel-all">Select all matching</button><button class="btn" data-act="bsel-none">Clear selection</button><button class="btn" data-act="bdel" style="color:#dc2626">Delete selected</button><span id="bkm" class="mu"></span></div><div id="arec"></div></div></div>`;status();admTable();updBulk();bvList()}
function admTable(){const el=$('#arec');if(!el)return;const q=AQ.toLowerCase().split(/\s+/).filter(Boolean);
const ok=r=>(!AF.type||r['Type of API']==AF.type)&&(!AF.pv||(r.IITD||'').toLowerCase().split(',').map(s=>s.trim()).includes(AF.pv.toLowerCase()))&&(!AF.rk||(AF.rk=='Unranked'?!r.Rank:r.Rank==AF.rk))&&(!AF.mod||(r.Modality||'Unspecified')==AF.mod);
const L=[];REC.forEach((r,i)=>{if(ok(r)&&q.every(w=>COLS.some(c=>(r[c]||'').toLowerCase().includes(w))))L.push(i)});L.reverse();LST=L;const vis=L.slice(0,AL);
el.innerHTML=`<p class="mu" style="margin:0 0 8px">${L.length} matching rows</p><div class="tw"><table><tr><th><input type="checkbox" data-selall aria-label="Select the rows shown"${vis.length&&vis.every(i=>SEL.has(REC[i]))?' checked':''}></th><th></th><th>API</th><th>Modality</th><th>Language</th><th>Type</th><th>Level</th><th>Added</th><th>University</th><th>Rank</th></tr>${vis.map(i=>{const r=REC[i];return`<tr><td><input type="checkbox" data-sel="${i}"${SEL.has(r)?' checked':''}></td><td><button class="btn" data-act="edit" data-i="${i}">Edit</button> <button class="btn" data-act="del" data-i="${i}">Delete</button></td><td class="api">${esc(r['API Name'])}</td><td>${esc(r.Modality)}</td><td>${esc(r['Language (s)'])}</td><td>${esc(r['Type of API'])}</td><td>${esc(r.Level)}</td><td>${esc(r['Date Added'])}</td><td>${esc(r.IITD)}</td><td>${chip('rk',r.Rank||'Unranked')}</td></tr>`}).join('')}</table></div>`+(L.length>AL?'<button class="more" data-act="more">Show more</button>':'')}
function form(i){const nw=i==null,r=nw?{'Date Added':'',Level:'Page'}:REC[i],uniq=k=>[...new Set(REC.map(x=>x[k]).filter(Boolean))].sort();
const f=(k,l,ls)=>`<label class="fl">${l}<input data-f="${k}" value="${esc(r[k]||'')}"${ls?` list="dl-${ls}"`:''}></label>`,ta=(k,l)=>`<label class="fl">${l}<textarea data-f="${k}" rows="2">${esc(r[k]||'')}</textarea></label>`;
const ck=(n,vs,sel)=>vs.map(v=>`<label class="cb"><input type="checkbox" data-g="${n}" value="${esc(v)}"${sel.includes(v)?' checked':''}>${esc(v)}</label>`).join('');
const provs=[...new Set(rows.flatMap(x=>x.prov))].sort(),cur=(r.IITD||'').split(',').map(s=>s.trim()),langs=[...new Set(rows.filter(x=>!x.nl).map(x=>x.lang))].sort(),dv=pd(r['Date Added']||'');
const today=new Date(),iso=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
$('#dw').innerHTML=`<div role="dialog" aria-label="Edit API"><div style="display:flex;justify-content:space-between;align-items:center;padding-top:16px"><h2 style="font-family:'Bricolage Grotesque',sans-serif;margin:0">${nw?'Add a new API':'Edit row'}</h2><button class="ib" data-act="close" aria-label="Close">✕</button></div>
<datalist id="dl-type">${uniq('Type of API').map(v=>`<option value="${esc(v)}">`).join('')}</datalist><datalist id="dl-lvl"><option>Page<option>Word<option>Line<option>Character<option>Table</datalist><datalist id="dl-rank"><option>High<option>Medium<option>Low</datalist><datalist id="dl-mod"><option>Printed<option>Handwritten<option>SceneText</datalist>
<div style="margin-top:14px">${f('Internal Name','Internal name')}${f('API Name','API name (leave blank to reuse the internal name)')}${f('Type of API','Type of API','type')}${f('Level','Level','lvl')}<label class="fl">Date added<input type="date" data-f="date" value="${nw?iso:dv}"></label>${f('Rank','Rank (optional)','rank')}
<div class="fl">University / provider<div class="row" style="margin-top:4px">${ck('pv',provs,cur)}</div><input data-f="pvx" placeholder="Another provider (comma separated)"></div>
${ta('Technical Details associated','Technical details')}${ta('References','References')}${ta('Detailed Remaks','Detailed remarks')}
${nw?`<div class="fl">Modality<div class="row" style="margin-top:4px">${ck('mod',['Printed','Handwritten','SceneText'],[])}</div></div><div class="fl">Languages<div class="row" style="margin-top:4px">${ck('lang',langs,[])}</div><input data-f="langx" placeholder="Another language (comma separated)"></div><p style="color:var(--mu);font-size:13px">One row is created for every modality and language you pick.</p>`:`${f('Modality','Modality','mod')}${f('Language (s)','Language')}<label class="cb" style="margin-bottom:10px"><input type="checkbox" data-f="all"> Apply these shared fields to every row of this API</label>`}</div>
<div class="row" style="gap:8px;margin-top:8px"><button class="btn" data-act="save"${nw?'':` data-i="${i}"`} style="background:var(--ac);color:var(--bg)">${nw?'Add API':'Save changes'}</button><button class="btn" data-act="close">Cancel</button></div></div>`;$('#dw').hidden=false}
function saveForm(i){const v=k=>{const e=document.querySelector('#dw [data-f="'+k+'"]');return e?e.value.trim():''},g=n=>[...document.querySelectorAll('#dw [data-g="'+n+'"]:checked')].map(x=>x.value),sp=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
const base={'Internal Name':v('Internal Name'),'API Name':v('API Name')||v('Internal Name'),'Type of API':v('Type of API'),Level:v('Level'),'Date Added':isoToD(v('date')||'1970-01-01'),IITD:[...g('pv'),...sp(v('pvx'))].join(', '),Rank:v('Rank'),'Technical Details associated':v('Technical Details associated'),References:v('References'),'Detailed Remaks':v('Detailed Remaks')};
if(!base['API Name'])return alert('Enter an internal name or API name.');
if(i==null){const M=g('mod'),L=[...g('lang'),...sp(v('langx'))];if(!M.length||!L.length)return alert('Pick at least one modality and one language.');M.forEach(m=>L.forEach(l=>REC.push({...base,Modality:m,'Language (s)':l})))}
else{const o=REC[i],key=o['Internal Name']+'\u0001'+o['API Name'],all=document.querySelector('#dw [data-f="all"]').checked;REC.forEach(r=>{if(r!==o&&all&&r['Internal Name']+'\u0001'+r['API Name']==key)Object.assign(r,base)});Object.assign(o,base,{Modality:v('Modality'),'Language (s)':v('Language (s)')})}
$('#dw').hidden=true;changed()}
const bm=s=>{const e=$('#bkm');if(e)e.textContent=s};
function bset(f,v,l){if(!SEL.size)return bm('Select some rows first.');const n=SEL.size;SEL.forEach(r=>r[f]=v);lite();bm(l+' on '+n+' rows. Publish to make it live.')}
function act(a,i){i=i==null?null:+i;
if(a=='add')form(null);else if(a=='edit')form(i);else if(a=='del'){if(confirm('Delete this row?')){SEL.delete(REC[i]);REC.splice(i,1);changed()}}
else if(a=='save')saveForm(i);else if(a=='pub')publish();
else if(a=='restore'){try{REC=JSON.parse(localStorage.getItem('draft'));SEL.clear();changed()}catch(_){}}
else if(a=='discard'){if(confirm('Throw away all unpublished changes?')){try{localStorage.removeItem('draft')}catch(_){}load()}}
else if(a=='imr'||a=='ima'){IMP=a;$('#imp').click()}else if(a=='more'){AL+=100;admTable()}else if(a=='close')$('#dw').hidden=true;
else if(a.startsWith('rk-')){const v=a.slice(3);bset('Rank',v=='Unranked'?'':v,v=='Unranked'?'Rank cleared':'Rank set to '+v)}
else if(a=='bapply'){const f=$('#bf').value,v=$('#bv').value.trim();if(!SEL.size)return bm('Select some rows first.');if(!v&&!confirm('Clear this field on '+SEL.size+' rows?'))return;bset(f,v,'Updated')}
else if(a=='bsel-all'){LST.forEach(j=>SEL.add(REC[j]));admTable();updBulk()}
else if(a=='bsel-none'){SEL.clear();admTable();updBulk()}
else if(a=='bdel'){if(!SEL.size)return bm('Select some rows first.');if(confirm('Delete '+SEL.size+' selected rows?')){const n=SEL.size;REC=REC.filter(r=>!SEL.has(r));SEL.clear();lite();bm(n+' rows deleted. Publish to make it live.')}}
else if(a.startsWith('x')){const[k,f]=a.split('-');exp(f,k=='xa'?REC:fRecs())}}
document.addEventListener('input',e=>{if(e.target.id=='aq'){AQ=e.target.value;AL=100;admTable()}});
function saveCfg(k,v){try{if(k=='tk')sessionStorage.setItem('tk',v.trim());else{const c=gcfg();c[k]=v.trim();localStorage.setItem('gh',JSON.stringify(c))}}catch(_){}}
function importCSV(el){el.files[0].text().then(x=>{try{const n=parseCSV(x);if(!n.length||!('API Name' in n[0]))throw 0;REC=IMP=='imr'?n:REC.concat(n);SEL.clear();changed()}catch(_){msg('That file is not a CSV with the same columns as data.csv.',1)}el.value=''})}
document.addEventListener('change',e=>{const el=e.target,d=el.dataset||{};
if(el.id=='so'){S.sort=el.value;render()}
else if(el.id=='imp'&&el.files[0])importCSV(el);
else if(d.cfg)saveCfg(d.cfg,el.value);
else if(d.sel!=null){const r=REC[+d.sel];el.checked?SEL.add(r):SEL.delete(r);updBulk()}
else if('selall' in d){LST.slice(0,AL).forEach(j=>el.checked?SEL.add(REC[j]):SEL.delete(REC[j]));admTable();updBulk()}
else if(d.af){AF[d.af]=el.value;AL=100;admTable()}
else if(el.id=='bf'){BF=el.value;bvList()}});
const TT=document.createElement('div');TT.className='tt';TT.hidden=true;document.body.appendChild(TT);
document.addEventListener('mousemove',e=>{const x=e.target.closest&&e.target.closest('[data-tt]');if(!x){TT.hidden=true;return}TT.innerHTML=x.dataset.tt;TT.hidden=false;const w=TT.offsetWidth,h=TT.offsetHeight;let l=e.clientX+14,y=e.clientY+14;if(l+w>innerWidth-8)l=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;TT.style.left=Math.max(8,l)+'px';TT.style.top=Math.max(8,y)+'px'});
document.addEventListener('mouseleave',()=>{TT.hidden=true});
S.tab=tabFromHash();applyTab();
load();
</script></body></html>

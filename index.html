.sb input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:500 18px 'IBM Plex Sans',sans-serif;padding:10px 0;outline:0}

.tile.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 26%,var(--sf))}
.lay{display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}
.side{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100vh - 80px);overflow:auto;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:6px 14px;scrollbar-width:thin}
.fg{border-bottom:1px solid var(--ln);padding:8px 0}.fg:last-child{border:0}

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const pd=s=>{s=(s||'').trim();let m=s.match(/^\d{4}-\d\d-\d\d$/);if(m)return s;m=s.match(/^(\d{1,2})-(\w{3})-(\d{4})$/);return m&&MN.indexOf(m[2])>=0?m[3]+'-'+String(MN.indexOf(m[2])+1).padStart(2,'0')+'-'+m[1].padStart(2,'0'):'1970-01-01'};
const isoToD=i=>{const[y,m,d]=i.split('-');return+d+'-'+MN[m-1]+'-'+y};
function parseCSV(t){const out=[];let r=[],c='',q=false;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';out.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);out.push(r)}const h=out.shift().map(x=>x.trim());return out.filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])))}
function toCSV(recs){const e=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return[COLS.map(e).join(','),...recs.map(r=>COLS.map(c=>e(r[c])).join(','))].join('\n')}
let rows=[],BY=new Map(),REC=[];
function ingest(recs){REC=recs;const mi=new Map();rows=[];BY=new Map();recs.forEach(x=>{const g=k=>(x[k]||'').trim(),key=g('Internal Name')+'\u0001'+g('API Name');if(!mi.has(key))mi.set(key,mi.size);const m=mi.get(key),pv=g('IITD').split(',').map(p=>p.trim()).filter(Boolean).map(p=>p.toLowerCase()=='opensource'?'OpenSource':p);let lv=g('Level');lv=lv.charAt(0).toUpperCase()+lv.slice(1);
g('Language (s)').split(',').forEach(l=>{l=l.trim();l=LM[l]||l;const r={m,rec:x,int:g('Internal Name'),api:g('API Name'),mod:g('Modality')||'Unspecified',lang:l,type:g('Type of API'),lvl:lv,d:pd(g('Date Added')),pv,rk:g('Rank')||'Unranked',tech:g('Technical Details associated'),ref:g('References'),rem:g('Detailed Remaks')};r.y=r.d.slice(0,4);r.hay=[r.int,r.api,r.mod,r.lang,r.type,r.lvl,r.pv.join(' '),r.rk,r.tech,r.ref,r.rem,r.d,fd(r.d)].join(' ').toLowerCase();rows.push(r);(BY.get(m)||BY.set(m,[]).get(m)).push(r)})})}

const S={q:'',f:{},sort:'new',view:'cards',tab:'browse',lim:48,closed:new Set()};Object.keys(FAC).forEach(k=>S.f[k]=new Set());
const KEYS={u:'pv',univ:'pv',type:'type',t:'type',mod:'mod',m:'mod',lang:'lang',l:'lang',level:'lvl',rank:'rk',year:'y',y:'y',tech:'tech',api:'api'};
function qfn(q){const cs=(q.match(/"[^"]+"|\S+/g)||[]).map(t=>t.replace(/"/g,'').toLowerCase()).map(t=>{const i=t.indexOf(':'),k=i>0&&KEYS[t.slice(0,i)];if(k){const v=t.slice(i+1);return r=>[].concat(r[k]).join(' ').toLowerCase().includes(v)}return r=>r.hay.includes(t)});return r=>cs.every(c=>c(r))}
function filt(skip){const qf=qfn(S.q);return rows.filter(r=>qf(r)&&Object.keys(FAC).every(k=>k==skip||!S.f[k].size||FAC[k].g(r).some(v=>S.f[k].has(v))))}
const rsc=o=>Math.max(0,...[...o.rk].map(x=>3-RO.indexOf(x)));
function groups(rs){const g=new Map();rs.forEach(r=>{let o=g.get(r.m);if(!o)g.set(r.m,o={m:r.m,api:r.api,int:r.int,pv:new Set(),type:new Set(),mod:new Map(),lvl:new Set(),rk:new Set(),lang:new Set(),d0:r.d,d1:r.d,tech:new Set(),n:0});r.pv.forEach(p=>o.pv.add(p));o.type.add(r.type);o.lvl.add(r.lvl);o.rk.add(r.rk);o.lang.add(r.lang);if(r.tech)o.tech.add(r.tech);o.n++;(o.mod.get(r.mod)||o.mod.set(r.mod,new Set()).get(r.mod)).add(r.lang);if(r.d<o.d0)o.d0=r.d;if(r.d>o.d1)o.d1=r.d});return[...g.values()]}
const SORT={new:(a,b)=>b.d1.localeCompare(a.d1),old:(a,b)=>a.d0.localeCompare(b.d0),az:(a,b)=>a.api.localeCompare(b.api),cov:(a,b)=>b.lang.size-a.lang.size,rank:(a,b)=>rsc(b)-rsc(a)};
const ORD=k=>k=='y'?(a,b)=>b[0]-a[0]:k=='rk'?(a,b)=>RO.indexOf(a[0])-RO.indexOf(b[0]):(a,b)=>b[1].size-a[1].size||a[0].localeCompare(b[0]);
function side(){$('#side').innerHTML=Object.entries(FAC).map(([k,F])=>{const c=new Map();filt(k).forEach(r=>F.g(r).forEach(v=>(c.get(v)||c.set(v,new Set()).get(v)).add(r.m)));S.f[k].forEach(v=>c.has(v)||c.set(v,new Set()));
return`<details data-k="${k}" ${S.closed.has(k)?'':'open'} class="fg"><summary>${F.t}${S.f[k].size?`<b>${S.f[k].size}</b>`:''}</summary><div class="opts">${[...c].sort(ORD(k)).map(([v,s])=>`<button class="op${S.f[k].has(v)?' on':''}" style="--c:${cc(k,v)}" data-k="${k}" data-v="${esc(v)}"><i></i><span title="${esc(v)}">${esc(v)}</span><em>${s.size}</em></button>`).join('')}</div></details>`}).join('')}
const TL={Hindi:'अ',Bengali:'অ',Tamil:'அ',Telugu:'అ',Kannada:'ಅ',Malayalam:'അ',Gujarati:'અ',Punjabi:'ਅ',Oriya:'ଅ',Assamese:'ৰ',Urdu:'ا',Marathi:'ळ',English:'A',Sanskrit:'ॐ'};

function card(o){const pv=[...o.pv],st=pv.length>1?`linear-gradient(90deg,${pv.map(p=>PC[p]||'#64748b').join(',')})`:(PC[pv[0]]||'#64748b'),L=[...o.lang].sort();
return`<article class="card" tabindex="0" role="button" data-m="${o.m}"><div class="strip" style="background:${st}"></div><div class="hd"><div class="api">${esc(o.api)}</div>${[...o.rk].filter(x=>x!='Unranked').sort((a,b)=>RO.indexOf(a)-RO.indexOf(b)).slice(0,1).map(x=>chip('rk',x)).join('')}</div>${o.int!=o.api?`<div class="int">${esc(o.int)}</div>`:''}
<div class="row">${[...o.type].map(t=>chip('type',t)).join('')}${pv.map(p=>chip('pv',p)).join('')}</div>
<div class="row">${[...o.mod].map(([m,s])=>chip('mod',m,`<small>${s.size}</small>`)).join('')}${[...o.lvl].map(l=>chip('lvl',l)).join('')}</div>
<div class="row">${L.slice(0,6).map(l=>chip('lang',l)).join('')}${L.length>6?`<span class="ch">+${L.length-6}</span>`:''}</div>
${o.tech.size?`<div class="tech">${esc([...o.tech][0])}</div>`:''}<div class="ft"><span>${L.length} language${L.length>1?'s':''}</span><span>${o.d0==o.d1?fd(o.d0):fd(o.d0)+' to '+fd(o.d1)}</span></div></article>`}
function render(){side();tiles();const rs=filt(),gs=groups(rs).sort(SORT[S.sort]);
const act=Object.keys(FAC).flatMap(k=>[...S.f[k]].map(v=>`<span class="ch rm" style="--c:${cc(k,v)}" data-k="${k}" data-v="${esc(v)}" title="Remove filter">${esc(v)} ✕</span>`));
$('#bar').innerHTML=`<div class="n">${gs.length} APIs <small>from ${rs.length} model entries</small></div>${act.join('')}${act.length||S.q?'<button class="btn" id="clr">Clear all</button>':''}<button id="fb" class="btn">Filters</button><select id="so" aria-label="Sort">${Object.entries({new:'Newest',old:'Oldest',az:'Name A–Z',cov:'Most languages',rank:'Best rank'}).map(([k,v])=>`<option value="${k}"${S.sort==k?' selected':''}>${v}</option>`).join('')}</select><div class="seg"><button data-v="cards" class="${S.view=='cards'?'on':''}">Cards</button><button data-v="table" class="${S.view=='table'?'on':''}">Table</button></div><span style="color:var(--mu);font-size:13px">Export</span><div class="seg"><button data-act="xf-csv">CSV</button><button data-act="xf-xlsx">Excel</button><button data-act="xf-json">JSON</button></div>`;
let h='';if(!rs.length)h='<div class="empty"><b>No APIs match these filters.</b><br>Remove a filter or search fewer words.</div>';
else if(S.view=='cards')h=`<div class="grid">${gs.slice(0,S.lim).map(card).join('')}</div>`+(gs.length>S.lim?`<button class="more" id="mo">Show more (${gs.length-S.lim} left)</button>`:'');
else{const t=rs.slice().sort((a,b)=>b.d.localeCompare(a.d));h=`<div class="tw"><table><tr><th>API</th><th>Modality</th><th>Language</th><th>Type</th><th>Level</th><th>Added</th><th>University</th><th>Rank</th><th>Technical details</th></tr>${t.slice(0,S.lim*3).map(r=>`<tr class="c" data-m="${r.m}"><td class="api">${esc(r.api)}</td><td>${chip('mod',r.mod)}</td><td>${chip('lang',r.lang)}</td><td>${chip('type',r.type)}</td><td>${chip('lvl',r.lvl)}</td><td>${fd(r.d)}</td><td>${r.pv.map(p=>chip('pv',p)).join(' ')}</td><td>${chip('rk',r.rk)}</td><td>${esc(r.tech)}</td></tr>`).join('')}</table></div>`+(t.length>S.lim*3?`<button class="more" id="mo">Show more</button>`:'')}
$('#res').innerHTML=h;if(S.tab=='insights')insights(rs)}
function bars(rs,k){const c=new Map();rs.forEach(r=>FAC[k].g(r).forEach(v=>(c.get(v)||c.set(v,new Set()).get(v)).add(r.m)));const e=[...c].sort((a,b)=>b[1].size-a[1].size),mx=e[0]?e[0][1].size:1;

function insights(rs){const first=new Map();rs.forEach(r=>{if(!first.has(r.m)||r.d<first.get(r.m))first.set(r.m,r.d)});const q=new Map();first.forEach(d=>{const k=d.slice(0,4)+' Q'+(Math.ceil(+d.slice(5,7)/3));q.set(k,(q.get(k)||0)+1)});
const qs=[...q].sort((a,b)=>a[0].localeCompare(b[0])),mx=Math.max(1,...qs.map(x=>x[1])),W=34;

const cm=new Map(),ps=[...new Set(rs.flatMap(r=>r.pv))].sort(),ms=['Printed','Handwritten','SceneText'];rs.forEach(r=>{[['m',r.mod],...r.pv.map(p=>['p',p])].forEach(([t,v])=>{const key=r.lang+'|'+v;(cm.get(key)||cm.set(key,new Set()).get(key)).add(r.m)})});
const ls=[...new Set(rs.map(r=>r.lang))].sort((a,b)=>rows.filter(r=>r.lang==b).length-rows.filter(r=>r.lang==a).length);let hm=0;cm.forEach(s=>hm=Math.max(hm,s.size));

else if(c('#th')){const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dk?'light':'dark';try{localStorage.setItem('th',d.dataset.theme)}catch(_){}}});
document.addEventListener('change',e=>{if(e.target.id=='so'){S.sort=e.target.value;render()}});
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)e.target.open?S.closed.delete(k):S.closed.add(k)},true);
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#dw').hidden=true;else if(e.key=='/'&&document.activeElement.tagName!='INPUT'){e.preventDefault();$('#q').focus()}else if(e.key=='Enter'&&e.target.classList.contains('card'))open(+e.target.dataset.m)});
let tm;$('#q').addEventListener('input',e=>{clearTimeout(tm);tm=setTimeout(()=>{S.q=e.target.value;S.lim=48;render()},120)});
try{const t=localStorage.getItem('th');if(t)document.documentElement.dataset.theme=t}catch(_){}

let SRC='',DIRTY=0,AQ='',AL=100,IMP='';
const gcfg=()=>{try{return{branch:'main',path:'data.csv',...JSON.parse(localStorage.getItem('gh')||'{}')}}catch(_){return{branch:'main',path:'data.csv'}}};
const msg=(s,bad)=>{const e=$('#amsg');if(e){e.textContent=s;e.style.color=bad?'#dc2626':'#16a34a'}};
const dl=(n,b)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove()};
const fRecs=()=>[...new Set(filt().map(r=>r.rec))];
async function exp(kind,recs){const n='indic-ocr-apis-'+new Date().toISOString().slice(0,10);
if(kind=='csv')dl(n+'.csv',new Blob([toCSV(recs)],{type:'text/csv'}));else if(kind=='json')dl(n+'.json',new Blob([JSON.stringify(recs,null,1)],{type:'application/json'}));
else try{if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(recs,{header:COLS}),'APIs');XLSX.writeFile(wb,n+'.xlsx')}catch(e){alert('Excel export needs to load a small library from the internet. Check your connection or use CSV.')}}
async function load(){DIRTY=0;let t;try{const r=await fetch('data.csv?v='+Date.now());if(!r.ok)throw 0;t=await r.text();SRC='data.csv on the server'}catch(e){t=$('#seed').textContent;SRC='the copy built into this page'}ingest(parseCSV(t));boot()}
function changed(){DIRTY=1;try{localStorage.setItem('draft',JSON.stringify(REC))}catch(_){}ingest(REC);boot()}
function boot(){const nl=new Set(rows.map(r=>r.lang)).size,np=new Set(rows.flatMap(r=>r.pv)).size;$('#lead').textContent=`${BY.size} APIs from ${np} universities and providers, covering ${nl} languages and scripts. Search by name, language or note, or narrow things down with the filters.`;render();admRender()}
async function publish(){const c=gcfg(),tk=sessionStorage.getItem('tk');if(!c.owner||!c.repo||!tk)return msg('Fill in owner, repository and token first.',1);
const u=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}`,H={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};msg('Publishing…');
try{let sha;const g=await fetch(u+'?ref='+encodeURIComponent(c.branch),{headers:H});if(g.ok)sha=(await g.json()).sha;else if(g.status!=404)throw new Error('GitHub returned '+g.status+' while reading the file. Check owner, repository, branch and token.');
const b=new TextEncoder().encode(toCSV(REC));let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode(...b.subarray(i,i+8192));
const p=await fetch(u,{method:'PUT',headers:H,body:JSON.stringify({message:'Update API list ('+REC.length+' rows)',content:btoa(s),sha,branch:c.branch})});
if(!p.ok)throw new Error('GitHub returned '+p.status+': '+((await p.json()).message||''));
DIRTY=0;try{localStorage.removeItem('draft')}catch(_){}admRender();msg('Published. The public site shows the update in about a minute.')}catch(e){msg(e.message,1)}}
function admRender(){const a=$('#admin');if(a.hidden)return;const c=gcfg();let dr=null;try{dr=localStorage.getItem('draft')}catch(_){}
const fi=(k,l,v,ty='text')=>`<label class="fl">${l}<input data-cfg="${k}" type="${ty}" value="${esc(v||'')}" autocomplete="off"></label>`;
a.innerHTML=`<div class="ins"><div class="pn w"><h3>Admin panel</h3><p style="margin:0 0 12px;color:var(--mu)">${REC.length} rows in ${BY.size} APIs. Loaded from ${SRC}. ${DIRTY?'<b style="color:#dc2626">You have unpublished changes.</b> Visitors only see them after you publish.':'No unpublished changes.'}</p>
<div class="row" style="gap:8px"><button class="btn" data-act="add">Add new API</button><button class="btn" data-act="pub" style="background:var(--ac);color:var(--bg)">Publish to GitHub</button>${dr&&!DIRTY?'<button class="btn" data-act="restore">Restore unsaved draft</button>':''}${DIRTY?'<button class="btn" data-act="discard">Discard changes</button>':''}<button class="btn" data-act="xa-csv">Export all CSV</button><button class="btn" data-act="xa-xlsx">Export all Excel</button><button class="btn" data-act="xa-json">Export all JSON</button></div><p id="amsg" style="margin:12px 0 0;font-weight:500"></p></div>
<div class="pn"><h3>GitHub connection</h3>${fi('owner','Owner (user or organisation)',c.owner)}${fi('repo','Repository name',c.repo)}${fi('branch','Branch',c.branch)}${fi('path','Data file path',c.path)}${fi('tk','Access token (kept only for this browser session)',sessionStorage.getItem('tk'),'password')}</div>
<div class="pn"><h3>Import a CSV</h3><p style="color:var(--mu);margin-top:0">Use a file with the same column headings as data.csv.</p><input type="file" id="imp" accept=".csv" hidden><div class="row" style="gap:8px"><button class="btn" data-act="imr">Replace everything</button><button class="btn" data-act="ima">Add to existing rows</button></div></div>
<div class="pn w"><h3>All rows (newest added first)</h3><label class="fl"><input id="aq" placeholder="Filter rows by any word" value="${esc(AQ)}"></label><div id="arec"></div></div></div>`;admTable()}
function admTable(){const el=$('#arec');if(!el)return;const q=AQ.toLowerCase().split(/\s+/).filter(Boolean),L=[];REC.forEach((r,i)=>{if(q.every(w=>COLS.some(c=>(r[c]||'').toLowerCase().includes(w))))L.push(i)});L.reverse();
el.innerHTML=`<p style="color:var(--mu);margin:0 0 8px">${L.length} matching rows</p><div class="tw"><table><tr><th></th><th>API</th><th>Modality</th><th>Language</th><th>Type</th><th>Level</th><th>Added</th><th>University</th><th>Rank</th></tr>${L.slice(0,AL).map(i=>{const r=REC[i];return`<tr><td><button class="btn" data-act="edit" data-i="${i}">Edit</button> <button class="btn" data-act="del" data-i="${i}">Delete</button></td><td class="api">${esc(r['API Name'])}</td><td>${esc(r.Modality)}</td><td>${esc(r['Language (s)'])}</td><td>${esc(r['Type of API'])}</td><td>${esc(r.Level)}</td><td>${esc(r['Date Added'])}</td><td>${esc(r.IITD)}</td><td>${esc(r.Rank)}</td></tr>`}).join('')}</table></div>`+(L.length>AL?'<button class="more" data-act="more">Show more</button>':'')}
function form(i){const nw=i==null,r=nw?{'Date Added':'',Level:'Page'}:REC[i],uniq=k=>[...new Set(REC.map(x=>x[k]).filter(Boolean))].sort();
const f=(k,l,ls)=>`<label class="fl">${l}<input data-f="${k}" value="${esc(r[k]||'')}"${ls?` list="dl-${ls}"`:''}></label>`,ta=(k,l)=>`<label class="fl">${l}<textarea data-f="${k}" rows="2">${esc(r[k]||'')}</textarea></label>`;
const ck=(n,vs,sel)=>vs.map(v=>`<label class="cb"><input type="checkbox" data-g="${n}" value="${esc(v)}"${sel.includes(v)?' checked':''}>${esc(v)}</label>`).join('');
const provs=[...new Set(rows.flatMap(x=>x.pv))].sort(),cur=(r.IITD||'').split(',').map(s=>s.trim()),langs=[...new Set(rows.map(x=>x.lang))].sort(),dv=pd(r['Date Added']||'');
const today=new Date(),iso=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
$('#dw').innerHTML=`<div role="dialog" aria-label="Edit API"><div style="display:flex;justify-content:space-between;align-items:center;padding-top:16px"><h2 style="font-family:'Bricolage Grotesque',sans-serif;margin:0">${nw?'Add a new API':'Edit row'}</h2><button class="ib" data-act="close" aria-label="Close">✕</button></div>
<datalist id="dl-type">${uniq('Type of API').map(v=>`<option value="${esc(v)}">`).join('')}</datalist><datalist id="dl-lvl"><option>Page<option>Word<option>Line<option>Character<option>Table</datalist><datalist id="dl-rank"><option>High<option>Medium<option>Low</datalist><datalist id="dl-mod"><option>Printed<option>Handwritten<option>SceneText</datalist>
<div style="margin-top:14px">${f('Internal Name','Internal name')}${f('API Name','API name (leave blank to reuse the internal name)')}${f('Type of API','Type of API','type')}${f('Level','Level','lvl')}<label class="fl">Date added<input type="date" data-f="date" value="${nw?iso:dv}"></label>${f('Rank','Rank (optional)','rank')}
<div class="fl">University / provider<div class="row" style="margin-top:4px">${ck('pv',provs,cur)}</div><input data-f="pvx" placeholder="Another provider (comma separated)"></div>
${ta('Technical Details associated','Technical details')}${ta('References','References')}${ta('Detailed Remaks','Detailed remarks')}
${nw?`<div class="fl">Modality<div class="row" style="margin-top:4px">${ck('mod',['Printed','Handwritten','SceneText'],[])}</div></div><div class="fl">Languages<div class="row" style="margin-top:4px">${ck('lang',langs,[])}</div><input data-f="langx" placeholder="Another language (comma separated)"></div><p style="color:var(--mu);font-size:13px">One row is created for every modality and language you pick.</p>`:`${f('Modality','Modality','mod')}${f('Language (s)','Language')}<label class="cb" style="margin-bottom:10px"><input type="checkbox" data-f="all"> Apply these shared fields to every row of this API</label>`}</div>
<div class="row" style="gap:8px;margin-top:8px"><button class="btn" data-act="save"${nw?'':` data-i="${i}"`} style="background:var(--ac);color:var(--bg)">${nw?'Add API':'Save changes'}</button><button class="btn" data-act="close">Cancel</button></div></div>`;$('#dw').hidden=false}
function saveForm(i){const v=k=>{const e=document.querySelector('#dw [data-f="'+k+'"]');return e?e.value.trim():''},g=n=>[...document.querySelectorAll('#dw [data-g="'+n+'"]:checked')].map(x=>x.value),sp=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
const base={'Internal Name':v('Internal Name'),'API Name':v('API Name')||v('Internal Name'),'Type of API':v('Type of API'),Level:v('Level'),'Date Added':isoToD(v('date')||'1970-01-01'),IITD:[...g('pv'),...sp(v('pvx'))].join(', '),Rank:v('Rank'),'Technical Details associated':v('Technical Details associated'),References:v('References'),'Detailed Remaks':v('Detailed Remaks')};
if(!base['API Name'])return alert('Enter an internal name or API name.');
if(i==null){const M=g('mod'),L=[...g('lang'),...sp(v('langx'))];if(!M.length||!L.length)return alert('Pick at least one modality and one language.');M.forEach(m=>L.forEach(l=>REC.push({...base,Modality:m,'Language (s)':l})))}
else{const o=REC[i],key=o['Internal Name']+'\u0001'+o['API Name'],all=document.querySelector('#dw [data-f="all"]').checked;REC.forEach(r=>{if(r!==o&&all&&r['Internal Name']+'\u0001'+r['API Name']==key)Object.assign(r,base)});Object.assign(o,base,{Modality:v('Modality'),'Language (s)':v('Language (s)')})}
$('#dw').hidden=true;changed()}
function act(a,i){i=i==null?null:+i;
if(a=='add')form(null);else if(a=='edit')form(i);else if(a=='del'){if(confirm('Delete this row?')){REC.splice(i,1);changed()}}
else if(a=='save')saveForm(i);else if(a=='pub')publish();
else if(a=='restore'){try{REC=JSON.parse(localStorage.getItem('draft'));changed()}catch(_){}}
else if(a=='discard'){if(confirm('Throw away all unpublished changes?')){try{localStorage.removeItem('draft')}catch(_){}load()}}
else if(a=='imr'||a=='ima'){IMP=a;$('#imp').click()}else if(a=='more'){AL+=100;admTable()}else if(a=='close')$('#dw').hidden=true;
else if(a.startsWith('x')){const[k,f]=a.split('-');exp(f,k=='xa'?REC:fRecs())}}
document.addEventListener('input',e=>{if(e.target.id=='aq'){AQ=e.target.value;AL=100;admTable()}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.cfg;try{if(k=='tk')sessionStorage.setItem('tk',e.target.value.trim());else if(k){const c=gcfg();c[k]=e.target.value.trim();localStorage.setItem('gh',JSON.stringify(c))}}catch(_){}
if(e.target.id=='imp'&&e.target.files[0]){const el=e.target;el.files[0].text().then(x=>{try{const n=parseCSV(x);if(!n.length||!('API Name' in n[0]))throw 0;REC=IMP=='imr'?n:REC.concat(n);changed()}catch(_){msg('That file is not a CSV with the same columns as data.csv.',1)}el.value=''})}});
try{const th=localStorage.getItem('th');if(th)document.documentElement.dataset.theme=th}catch(_){}
load();
</script></body></html>
